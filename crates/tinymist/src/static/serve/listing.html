<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dev/html/annotate.css">
<style>
  /* The listing is its own page, so its layout lives here rather than in the
     annotator's stylesheet, which is about a document and the marks on it. */
  .tm-listing {
    box-sizing: border-box;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
  }

  .tm-listing h1 {
    font: 600 1.5rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0 0 0.25rem;
  }

  .tm-listing .tm-where {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
    font-size: 0.85rem;
    margin: 0 0 2rem;
  }

  .tm-listing ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tm-listing li + li {
    border-top: 1px solid var(--tm-rule);
  }

  .tm-listing a {
    display: grid;
    /* A column wide enough for the file names in a directory of documents, so
       the titles beside them line up rather than stepping in and out. */
    grid-template-columns: minmax(11rem, auto) minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 0.15rem 1rem;
    padding: 0.85rem 0.6rem;
    margin: 0 -0.6rem;
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
  }

  .tm-listing a:hover {
    background: color-mix(in oklab, var(--tm-fg) 7%, transparent);
  }

  /* The same face and size as the file name beside it: the two are read as one
     line, and a larger title makes the names look like a subtitle. */
  .tm-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tm-file,
  .tm-when,
  .tm-notes {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
    font-size: 0.85rem;
  }

  .tm-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    flex: none;
  }

  /* The right-hand column: how much has been said about the document, and how
     long ago it changed. */
  .tm-meta {
    grid-column: 3;
    align-self: baseline;
    justify-self: end;
    display: flex;
    gap: 0.75rem;
    white-space: nowrap;
  }

  /* Not hidden but absent: a hidden one still takes its place, which put the
     time on a line of its own. */
  .tm-notes[data-count="0"] {
    display: none;
  }

  .tm-empty {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
  }
</style>
</head>
<body>
<main class="tm-listing">
  <h1 id="tm-title">Documents</h1>
  <p class="tm-where" id="tm-where"></p>
  <ul id="tm-docs"></ul>
  <p class="tm-empty" id="tm-empty" hidden>No documents here yet.</p>
</main>
<script>
  // The listing is data plus this page: the server answers `dev/docs` with the
  // directory as it is now, so a document added while the server runs is one
  // reload away rather than one restart.
  (() => {
    const docs = document.getElementById("tm-docs");
    const empty = document.getElementById("tm-empty");
    const text = (tag, cls, value) => {
      const el = document.createElement(tag);
      el.className = cls;
      el.textContent = value;
      return el;
    };
    // "just now", "14 min", "3 h", "2 d": past the day, the exact figure is
    // not what the reader is asking.
    const ago = (seconds) => {
      if (!(seconds >= 0)) return "";
      if (seconds < 60) return "just now";
      if (seconds < 3600) return `${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} h`;
      return `${Math.floor(seconds / 86400)} d`;
    };
    // Which directory this page is showing, as a path under the one being
    // served. The page is the same page at every depth; the path is in the
    // URL, and everything it asks for is asked about that path.
    // Where this page is mounted, from the server: `/a/` when the document is
    // annotated, `/v/` when it is only read. The page is the same page at every
    // depth, and everything after the mount is the directory being shown.
    const mount = () => {
      const said = document.querySelector('meta[name="tm-mount"]');
      return (said && said.content) || "/a/";
    };
    const here = () => {
      const at = location.pathname.indexOf(mount());
      const rest = at < 0 ? "" : location.pathname.slice(at + mount().length);
      return rest.replace(/^\/+|\/+$/g, "");
    };
    const render = (data) => {
      const under = data.under || "";
      // What the directory is called, not what is showing it: a listing page
      // is a directory, and "Typst Annotator: hgxz" is the annotator's name for
      // a document it is not showing.
      const called = (data.title || "Documents").replace(/^[^:]*:\s*/, "");
      const name = under ? under.split("/").pop() : called;
      document.title = name;
      document.getElementById("tm-title").textContent = name;
      document.getElementById("tm-where").textContent = data.dir || "";
      docs.textContent = "";
      empty.hidden =
        data.docs.length + (data.dirs || []).length + (data.files || []).length > 0;
      // Up first, then the directories, then the documents, then whatever else
      // is in here: a reader walks down a tree and back out of it.
      if (under) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "../";
        a.append(text("span", "tm-file", ".."));
        a.append(text("span", "tm-name", ""));
        li.append(a);
        docs.append(li);
      }
      for (const dir of data.dirs || []) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = dir + "/";
        a.append(text("span", "tm-file", dir + "/"));
        a.append(text("span", "tm-name", ""));
        li.append(a);
        docs.append(li);
      }
      for (const doc of data.docs) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        // Names are relative to this directory, since the page is at it.
        a.href = doc.slug.split("/").pop() + "/";
        // The file name in the column a file name is read down, and the title
        // beside it: the file is what a reader is looking for, and the title is
        // what tells them they have found it.
        a.append(text("span", "tm-file", doc.file));
        a.append(text("span", "tm-name", doc.title));
        const meta = document.createElement("span");
        meta.className = "tm-meta";
        const notes = text(
          "span",
          "tm-notes",
          doc.annotations === 1 ? "1 annotation" : `${doc.annotations} annotations`,
        );
        notes.dataset.count = doc.annotations;
        meta.append(notes);
        meta.append(text("span", "tm-when", ago(doc.age)));
        a.append(meta);
        li.append(a);
        docs.append(li);
      }
      for (const file of data.files || []) {
        // A server that has not been restarted since this page was may still
        // send a bare name.
        const named = typeof file === "string" ? { file } : file;
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = named.file;
        a.append(text("span", "tm-file", named.file));
        a.append(text("span", "tm-name", ""));
        const meta = document.createElement("span");
        meta.className = "tm-meta";
        if (named.age !== undefined) meta.append(text("span", "tm-when", ago(named.age)));
        a.append(meta);
        li.append(a);
        docs.append(li);
      }
    };
    const load = () =>
      // Asked at the mount, not relative to this page: the endpoint belongs to
      // the site, and a relative address at `/a/report/` would ask the site for
      // a document called `report/dev`.
      fetch(`${mount()}dev/docs?under=${encodeURIComponent(here())}`)
        .then((r) => r.json())
        .then(render)
        .catch(() => {});
    load();
    // Cheap enough to repeat: it is a directory read and a few file stats.
    setInterval(load, 5000);
    addEventListener("focus", load);
  })();
</script>
</body>
</html>
