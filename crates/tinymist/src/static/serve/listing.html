<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dev/html/annotate.css">
<style>
  /* The listing is its own page, so its layout lives here rather than in the
     annotator's stylesheet, which is about a document and the marks on it. */
  .tm-listing {
    box-sizing: border-box;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
  }

  .tm-listing h1 {
    font: 600 1.5rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0 0 0.25rem;
  }

  .tm-listing .tm-where {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
    font-size: 0.85rem;
    margin: 0 0 2rem;
  }

  .tm-listing ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tm-listing li + li {
    border-top: 1px solid var(--tm-rule);
  }

  .tm-listing a {
    display: grid;
    /* A column wide enough for the file names in a directory of documents, so
       the titles beside them line up rather than stepping in and out. */
    grid-template-columns: minmax(11rem, auto) minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 0.15rem 1rem;
    padding: 0.85rem 0.6rem;
    margin: 0 -0.6rem;
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
  }

  .tm-listing a:hover {
    background: color-mix(in oklab, var(--tm-fg) 7%, transparent);
  }

  /* The same face and size as the file name beside it: the two are read as one
     line, and a larger title makes the names look like a subtitle. */
  .tm-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tm-file,
  .tm-when,
  .tm-notes {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
    font-size: 0.85rem;
  }

  .tm-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    flex: none;
  }

  /* The right-hand column: how much has been said about the document, and how
     long ago it changed. */
  .tm-meta {
    grid-column: 3;
    align-self: baseline;
    justify-self: end;
    display: flex;
    gap: 0.75rem;
    white-space: nowrap;
  }

  /* Not hidden but absent: a hidden one still takes its place, which put the
     time on a line of its own. */
  .tm-notes[data-count="0"] {
    display: none;
  }

  .tm-empty {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
  }

  /* A directory of thousands is not a list to scroll: it is looked into. The
     search field and the letters are how, and they are there only when a
     directory is big enough to need them. */
  .tm-find {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 0.75rem;
  }

  .tm-find input {
    flex: 1;
    min-width: 0;
    box-sizing: border-box;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--tm-rule);
    background: color-mix(in oklab, var(--tm-fg) 5%, transparent);
    color: inherit;
    font: 0.9rem ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .tm-find input:focus {
    outline: 2px solid color-mix(in oklab, var(--tm-accent) 60%, transparent);
    outline-offset: -1px;
  }

  .tm-count {
    color: color-mix(in oklab, var(--tm-fg) 55%, transparent);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .tm-letters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.15rem;
    margin: 0 0 1rem;
  }

  .tm-letters button {
    min-width: 1.6rem;
    padding: 0.15rem 0.3rem;
    border: 1px solid transparent;
    border-radius: 4px;
    background: none;
    color: color-mix(in oklab, var(--tm-fg) 65%, transparent);
    font: 0.85rem ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer;
  }

  .tm-letters button:hover {
    background: color-mix(in oklab, var(--tm-fg) 8%, transparent);
  }

  .tm-letters button[data-on] {
    color: var(--tm-fg);
    border-color: color-mix(in oklab, var(--tm-fg) 25%, transparent);
    background: color-mix(in oklab, var(--tm-fg) 10%, transparent);
  }
</style>
</head>
<body>
<main class="tm-listing">
  <h1 id="tm-title">Documents</h1>
  <p class="tm-where" id="tm-where"></p>
  <div class="tm-find" id="tm-find" hidden>
    <input id="tm-search" type="search" placeholder="Type to find a document" autocomplete="off" spellcheck="false">
    <span class="tm-count" id="tm-count"></span>
  </div>
  <div class="tm-letters" id="tm-letters" hidden></div>
  <ul id="tm-docs"></ul>
  <p class="tm-empty" id="tm-empty" hidden>No documents here yet.</p>
</main>
<script>
  // The listing is data plus this page: the server answers `dev/docs` with the
  // directory as it is now, so a document added while the server runs is one
  // reload away rather than one restart.
  (() => {
    const docs = document.getElementById("tm-docs");
    const empty = document.getElementById("tm-empty");
    const find = document.getElementById("tm-find");
    const letters = document.getElementById("tm-letters");
    const search = document.getElementById("tm-search");
    const count = document.getElementById("tm-count");
    search.addEventListener("input", () => {
      query = search.value.trim().toLowerCase();
      draw();
      drawLetters();
    });
    const text = (tag, cls, value) => {
      const el = document.createElement(tag);
      el.className = cls;
      el.textContent = value;
      return el;
    };
    // "just now", "14 min", "3 h", "2 d": past the day, the exact figure is
    // not what the reader is asking.
    const ago = (seconds) => {
      if (!(seconds >= 0)) return "";
      if (seconds < 60) return "just now";
      if (seconds < 3600) return `${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} h`;
      return `${Math.floor(seconds / 86400)} d`;
    };
    // Which directory this page is showing, as a path under the one being
    // served. The page is the same page at every depth; the path is in the
    // URL, and everything it asks for is asked about that path.
    // Where this page is mounted, from the server: `/a/` when the document is
    // annotated, `/v/` when it is only read. The page is the same page at every
    // depth, and everything after the mount is the directory being shown.
    const mount = () => {
      const said = document.querySelector('meta[name="tm-mount"]');
      return (said && said.content) || "/a/";
    };
    const here = () => {
      const at = location.pathname.indexOf(mount());
      const rest = at < 0 ? "" : location.pathname.slice(at + mount().length);
      return rest.replace(/^\/+|\/+$/g, "");
    };
    // How many rows are drawn at once. A directory of twenty thousand files is
    // not a list to scroll: it is looked into, so the page shows a screenful
    // and leaves the rest to the search field and the letters.
    const PAGE = 16;
    // Below this a directory is just a list, and chrome for finding things in
    // it is chrome in the way.
    const BROWSE_FROM = 16;

    // What a row is, whatever it is a row of.
    const rowsOf = (data) => {
      const rows = [];
      if (data.under) rows.push({ kind: "up", href: "../", file: "..", name: "" });
      for (const dir of data.dirs || []) {
        rows.push({ kind: "dir", href: dir + "/", file: dir + "/", name: "" });
      }
      for (const doc of data.docs || []) {
        rows.push({
          kind: "doc",
          // Names are relative to this directory, since the page is at it.
          href: doc.slug.split("/").pop() + "/",
          file: doc.file,
          name: doc.title || "",
          age: doc.age,
          annotations: doc.annotations,
        });
      }
      for (const file of data.files || []) {
        // A server that has not been restarted since this page was may still
        // send a bare name.
        const named = typeof file === "string" ? { file } : file;
        rows.push({ kind: "file", href: named.file, file: named.file, name: "", age: named.age });
      }
      return rows;
    };

    // Every letter that begins something here, in order, so a directory of
    // Greek or of numbers is not offered a Latin alphabet it has nothing under.
    const letterOf = (row) => {
      const first = (row.file || "").replace(/^[^\p{L}\p{N}]+/u, "").charAt(0).toUpperCase();
      if (!first) return "#";
      return /\p{L}|\p{N}/u.test(first) ? first : "#";
    };

    // Does the query appear in the text, in order, and how well?
    //
    // A subsequence match, scored by how tightly the letters sit together and
    // whether they start words: typing "brcod" should find
    // "brown-comenetz-duality" without knowing where the dashes are.
    const fuzzy = (text, query) => {
      const said = text.toLowerCase();
      let at = 0;
      let score = 0;
      let last = -2;
      for (const want of query) {
        const found = said.indexOf(want, at);
        if (found < 0) return -1;
        // Together, and at the start of a word, are what makes a match feel
        // like the thing that was meant.
        if (found === last + 1) score += 3;
        if (found === 0 || /[^\p{L}\p{N}]/u.test(said[found - 1] || "")) score += 2;
        score += 1;
        last = found;
        at = found + 1;
      }
      // A short name matching is a better match than a long one that happens to
      // contain the letters.
      return score - said.length / 100;
    };

    let rows = [];
    let letter = "";
    let query = "";

    const drawRow = (row) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = row.href;
      a.append(text("span", "tm-file", row.file));
      a.append(text("span", "tm-name", row.name));
      if (row.age !== undefined || row.annotations !== undefined) {
        const meta = document.createElement("span");
        meta.className = "tm-meta";
        if (row.annotations !== undefined) {
          const notes = text(
            "span",
            "tm-notes",
            row.annotations === 1 ? "1 annotation" : `${row.annotations} annotations`,
          );
          notes.dataset.count = row.annotations;
          meta.append(notes);
        }
        if (row.age !== undefined) meta.append(text("span", "tm-when", ago(row.age)));
        a.append(meta);
      }
      li.append(a);
      docs.append(li);
    };

    const draw = () => {
      const browsing = rows.length > BROWSE_FROM;
      find.hidden = !browsing;
      letters.hidden = !browsing;
      // A search is over everything; a letter is a place to start reading from.
      let shown = rows;
      if (browsing) {
        if (query) {
          shown = rows
            .map((row) => ({ row, score: fuzzy(`${row.file} ${row.name}`, query) }))
            .filter((hit) => hit.score >= 0)
            .sort((one, two) => two.score - one.score)
            .map((hit) => hit.row);
        } else if (letter) {
          shown = rows.filter((row) => row.kind !== "doc" && row.kind !== "file"
            ? false
            : letterOf(row) === letter);
        }
      }
      const drawn = shown.slice(0, browsing ? PAGE : shown.length);
      docs.textContent = "";
      for (const row of drawn) drawRow(row);
      empty.hidden = shown.length > 0;
      count.textContent = browsing
        ? shown.length > drawn.length
          ? `${drawn.length} of ${shown.length}`
          : `${shown.length}`
        : "";
    };

    const drawLetters = () => {
      const seen = [];
      for (const row of rows) {
        if (row.kind !== "doc" && row.kind !== "file") continue;
        const at = letterOf(row);
        if (!seen.includes(at)) seen.push(at);
      }
      seen.sort();
      letters.textContent = "";
      const add = (label, value) => {
        const button = document.createElement("button");
        button.textContent = label;
        button.toggleAttribute("data-on", letter === value && !query);
        button.onclick = () => {
          letter = letter === value ? "" : value;
          query = "";
          search.value = "";
          draw();
          drawLetters();
        };
        letters.append(button);
      };
      add("all", "");
      for (const at of seen) add(at, at);
    };

    const render = (data) => {
      const under = data.under || "";
      // What the directory is called, not what is showing it: a listing page
      // is a directory, and "Typst Annotator: hgxz" is the annotator's name for
      // a document it is not showing.
      const called = (data.title || "Documents").replace(/^[^:]*:\s*/, "");
      const name = under ? under.split("/").pop() : called;
      document.title = name;
      document.getElementById("tm-title").textContent = name;
      document.getElementById("tm-where").textContent = data.dir || "";
      const fresh = rowsOf(data);
      // Redrawn only when it has changed: this is asked for every few seconds,
      // and a page that rebuilds itself under a reader's pointer loses their
      // place and their selection.
      const same =
        fresh.length === rows.length &&
        fresh.every((row, at) => {
          const was = rows[at];
          return (
            was &&
            was.file === row.file &&
            was.name === row.name &&
            was.age === row.age &&
            was.annotations === row.annotations
          );
        });
      if (same) return;
      rows = fresh;
      draw();
      drawLetters();
    };

    const load = () =>
      // Asked at the mount, not relative to this page: the endpoint belongs to
      // the site, and a relative address at `/a/report/` would ask the site for
      // a document called `report/dev`.
      fetch(`${mount()}dev/docs?under=${encodeURIComponent(here())}`)
        .then((r) => r.json())
        .then(render)
        .catch(() => {});
    load();
    // Cheap enough to repeat: it is a directory read and a few file stats.
    setInterval(load, 5000);
    addEventListener("focus", load);
  })();
</script>
</body>
</html>
